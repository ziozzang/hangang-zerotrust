{{- range $component := list "hangang" "hopae" "pumgye" "sumunjang" }}
{{- $ctx := dict "root" $ "component" $component }}
{{- if (index $.Values $component).enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "world.name" $ctx }}
  labels:
    {{- include "world.labels" $ctx | nindent 4 }}
# Only the Hangang controller talks to the Kubernetes API.
automountServiceAccountToken: {{ eq $component "hangang" }}
{{- end }}
{{- end }}
