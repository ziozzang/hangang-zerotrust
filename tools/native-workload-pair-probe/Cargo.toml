[package]
name = "observed-workload-pair-probe"
version = "0.0.0"
edition = "2024"
[dependencies]
hopae-grpc = { git = "https://github.com/ziozzang/hopae", rev = "4ea3e1473de61d6b46f5420efe481c126790d800", features = ["native-client"] }
hangang-runtime = { git = "https://github.com/ziozzang/hangang-runtime", rev = "bf3ba2c0ccfb8603a34b14a30bc52d5112f0677a" }
ed25519-dalek = "2.2.0"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }

pumgye-grpc = { git = "https://github.com/ziozzang/pumgye", rev = "ac47d448ba56b7ebb210b8ced56543d65c09f293" }
prost = "0.14"
tonic = { version = "0.14.6", features = ["tls-ring"] }
zeroize = "1"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
